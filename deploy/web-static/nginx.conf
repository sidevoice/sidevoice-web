server {
    listen 8080;
    root /usr/share/nginx/html;

    # The workers and the WebAssembly the in-browser models load.
    types {
        text/javascript js mjs;
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    location = / { return 302 /voice/; }
    location = /voice { return 302 /voice/; }
    location /voice/ { try_files $uri $uri/ /voice/index.html; }
    # Where the interface is pointed: never cached, it changes with the deployment.
    location = /voice/target.js { add_header Cache-Control "no-store"; }
    location /voice/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /voice-browser/ { add_header Cache-Control "no-cache"; }
}
