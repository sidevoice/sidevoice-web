name: ci

# Every pull request: the build, the tests, and the release packaging exactly as a release builds it
# (`node scripts/release.mjs dist`), publishing nothing. What passes here is what merging publishes (release.yml).
# RELEASING.md.
on:
  pull_request:
    branches: [main]
  # release-please.yml dispatches it on the release PR, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # The page and its packages are built before the suites run, so they test what a deployment serves.
      - run: npm run build
      - run: npm test
      - run: node scripts/release.mjs dist
