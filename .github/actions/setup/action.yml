name: Set up the Node build
description: >-
  Installs the pinned Node.js (and the npm it ships with), restores npm's download cache and installs the workspaces'
  locked dependencies.

runs:
  using: composite
  steps:
    # The one place the Node.js version is pinned.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22.23.3"
        cache: npm
    - name: Locked dependencies
      shell: bash
      run: npm ci
